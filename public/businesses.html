<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a business · Echo</title>
<style>body{margin:0;background:#eef2f6;color:#172235;font:16px system-ui,sans-serif}main{max-width:600px;margin:8vh auto;padding:32px;background:white;border-radius:16px}h1{margin-top:0}p{color:#566176}ul{list-style:none;padding:0}button{padding:16px;width:100%;text-align:left;border:1px solid #d4dce7;border-radius:8px;background:#f8fafc;color:#172235;cursor:pointer;margin-bottom:12px;font:inherit}button span{display:block;color:#566176;font-size:14px;margin-top:4px}a{color:#31599b}.logout{width:auto;padding:8px 16px}</style></head>
<body><main><h1>Choose a business</h1><p>Your messages stay with the selected business and phone number.</p><p id="status" role="status">Loading your businesses…</p><ul id="businesses"></ul><form action="/logout" method="post"><button class="logout">Sign out</button></form></main>
<script>
fetch('/api/businesses',{credentials:'same-origin'}).then(async response=>{if(!response.ok)throw new Error(response.status===401?'Sign in again to continue.':'Business access is temporarily unavailable.');return response.json();}).then(({items})=>{document.getElementById('status').textContent=items.length?'':'No messaging numbers are assigned to your businesses yet. Contact your platform administrator.';for(const item of items){const li=document.createElement('li'),form=document.createElement('form'),button=document.createElement('button'),number=document.createElement('span'),input=document.createElement('input');form.method='post';form.action='/select-business';input.type='hidden';input.name='businessNumber';input.value=String(item.iBusinessNumber);button.textContent=item.name;number.textContent=String(item.iBusinessNumber);button.append(number);form.append(input,button);li.append(form);document.getElementById('businesses').append(li);}}).catch(error=>{document.getElementById('status').textContent=error.message;});
</script></body></html>
