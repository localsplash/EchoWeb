<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Q-Derm Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    #conversations::-webkit-scrollbar,
    #messages::-webkit-scrollbar { width: 4px; }
    #conversations::-webkit-scrollbar-track,
    #messages::-webkit-scrollbar-track { background: transparent; }
    #conversations::-webkit-scrollbar-thumb,
    #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-anim { animation: msgIn 0.18s ease-out both; }
  </style>
</head>
<body class="bg-slate-50 font-sans overflow-hidden">
  <div id="app" class="flex h-dvh" data-panel="list">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="flex flex-col w-full md:w-80 md:min-w-[20rem] md:max-w-xs bg-white border-r border-slate-200 md:flex">

      <!-- Sidebar Header -->
      <div class="flex items-center justify-between px-4 py-3.5 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <h1 class="text-sm font-bold text-slate-900 tracking-tight">Q-Dermatology</h1>
        </div>
        <div class="flex gap-2">
          <button onclick="startNew()" class="p-2 rounded-lg hover:bg-slate-100 transition-colors" title="New conversation">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zM16.862 4.487L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/>
            </svg>
          </button>
          <button onclick="logout()" class="p-2 rounded-lg hover:bg-slate-100 transition-colors" title="Logout">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Conversation List -->
      <div id="conversations" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>

    </aside>

    <!-- THREAD PANEL -->
    <main id="thread" class="hidden md:flex flex-col flex-1 min-w-0 bg-[#f4f6fb]">

      <!-- Thread Header -->
      <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-200 bg-white shadow-sm">
        <!-- Back button (mobile) -->
        <button id="btnBack" onclick="showPanel('list')" class="md:hidden -ml-1 p-2 rounded-lg hover:bg-slate-100 transition-colors">
          <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </button>
        <!-- Avatar -->
        <div id="threadAvatar" class="hidden w-9 h-9 rounded-full bg-blue-100 text-blue-700 font-semibold text-sm flex items-center justify-center flex-shrink-0"></div>
        <!-- Title -->
        <div id="threadTitle" class="flex-1 font-semibold text-slate-800 truncate">Select a conversation</div>
        <!-- Customer input (drafting new) -->
        <input id="customerInput" class="hidden flex-1 px-3 py-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none text-sm" inputmode="numeric" maxlength="11" placeholder="10-digit customer number" />
        <!-- Menu -->
        <div class="relative">
          <button id="threadMenu" class="hidden p-2 rounded-lg hover:bg-slate-100 transition-colors" onclick="toggleThreadMenu(event)">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z"/>
            </svg>
          </button>
          <div id="threadMenuDropdown" class="hidden absolute right-0 top-full mt-1 w-48 bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden z-50 py-1">
            <button onclick="threadMenuAction('unread')" class="w-full px-4 py-2.5 text-left text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-3">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 9v.906a2.25 2.25 0 01-1.183 1.981l-6.478 3.488M2.25 9v.906a2.25 2.25 0 001.183 1.981l6.478 3.488m8.839 2.51l-4.66-2.51m0 0l-1.023-.55a2.25 2.25 0 00-2.134 0l-1.022.55m0 0l-4.661 2.51"/></svg>
              Mark unread
            </button>
            <button onclick="threadMenuAction('delete')" class="w-full px-4 py-2.5 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-3">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
              Delete conversation
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Area -->
      <div id="messages" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3 min-h-0">
        <div id="emptyState" class="m-auto text-center px-8">
          <div class="w-16 h-16 rounded-2xl bg-blue-50 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-blue-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
          </div>
          <p class="text-slate-500 text-sm font-medium">No conversation selected</p>
          <p class="text-slate-400 text-xs mt-1">Choose a patient from the list or start a new message</p>
        </div>
      </div>

      <!-- Attachment Previews -->
      <div id="attachments" class="hidden flex-wrap gap-2 px-4 pt-3 border-t border-slate-100 bg-white"></div>

      <!-- Compose Bar -->
      <form id="compose" class="hidden items-end gap-3 px-4 py-3 bg-white shadow-[0_-1px_6px_rgba(0,0,0,0.06)]" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom))">
        <!-- Paperclip / attach button -->
        <button type="button" id="btnAttach" class="flex-shrink-0 w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center transition-colors" title="Attach files">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13"/>
          </svg>
        </button>
        <input type="file" id="fileInput" multiple hidden
          accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.zip,.rar" />
        <textarea id="text" rows="1" placeholder="Type a message..." maxlength="2048"
          class="flex-1 resize-none rounded-2xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 px-4 py-2.5 text-sm leading-relaxed max-h-32 overflow-y-auto outline-none transition-all"></textarea>
        <button type="submit" class="flex-shrink-0 w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 flex items-center justify-center transition-colors">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
          </svg>
        </button>
      </form>

    </main>

  </div>
  <script src="/app.js"></script>
</body>
</html>
