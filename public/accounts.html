<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/img/echo-favicon.svg" type="image/svg+xml" />
  <title>Echo · Account Associations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

  <div class="max-w-5xl mx-auto px-4 py-6">

    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <a href="/internal" class="p-2 -ml-2 rounded-lg hover:bg-slate-200 transition-colors">
        <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
        </svg>
      </a>
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99
                 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03
                 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-tight">Account Associations</h1>
          <p class="text-xs text-slate-500">Orgs, users and business numbers</p>
        </div>
      </div>
      <a id="idAdminLink" href="#" class="hidden ml-auto text-xs font-semibold text-blue-600 hover:text-blue-700">
        Identity admin (sign-in methods) →
      </a>
    </div>

    <!-- Search -->
    <input id="filter" type="text" placeholder="Filter by org, email, number or CRM client id…"
      oninput="render()"
      class="w-full mb-5 px-4 py-2.5 rounded-xl border border-slate-200 focus:border-slate-500
             focus:ring-2 focus:ring-slate-200 outline-none text-sm transition-all" />

    <div id="list" class="space-y-4">
      <div class="text-sm text-slate-400">Loading…</div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-sm font-medium shadow-lg z-50"></div>

  <script src="/config.js"></script>
  <script>
    let ORGS = [];

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    function showToast(msg, ok = true) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl text-sm font-medium shadow-lg z-50 '
        + (ok ? 'bg-slate-900 text-white' : 'bg-red-600 text-white');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function fmtPhone(n) {
      const d = String(n ?? '').replace(/\D/g, '');
      return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (d || '—');
    }

    async function load() {
      try {
        const r = await fetch('/api/admin/accounts');
        if (r.status === 403) { location.href = '/'; return; }
        if (!r.ok) throw new Error();
        ORGS = (await r.json()).items || [];
        render();
      } catch {
        document.getElementById('list').innerHTML =
          '<div class="text-sm text-red-600">Could not load account associations.</div>';
      }
    }

    function matches(org, q) {
      if (!q) return true;
      const hay = [
        org.orgName, org.uispClientId, org.iBusinessNumber,
        ...org.users.flatMap(u => [u.email, u.displayName]),
      ].join(' ').toLowerCase();
      return hay.includes(q);
    }

    function render() {
      const q = document.getElementById('filter').value.trim().toLowerCase();
      const shown = ORGS.filter(o => matches(o, q));
      const list = document.getElementById('list');

      if (!shown.length) {
        list.innerHTML = '<div class="text-sm text-slate-400">No matching accounts.</div>';
        return;
      }

      list.innerHTML = shown.map(org => {
        const orphan = org.iOrgId === null;
        const header = orphan
          ? `<div>
               <div class="text-sm font-bold text-amber-700">Users with no organisation</div>
               <div class="text-xs text-slate-500">Provisioning that did not complete</div>
             </div>`
          : `<div class="min-w-0">
               <div class="text-sm font-bold text-slate-900 truncate">${esc(org.orgName || 'Untitled org')}</div>
               <div class="text-xs text-slate-500">
                 org #${org.iOrgId}
                 · CRM client ${esc(org.uispClientId ?? '—')}
                 · ${fmtPhone(org.iBusinessNumber)}
               </div>
             </div>`;

        const users = org.users.length
          ? org.users.map(u => `
              <div class="px-5 py-3 border-t border-slate-100">
                <div class="flex items-center justify-between gap-3 mb-2">
                  <div class="min-w-0">
                    <span class="text-sm font-medium text-slate-800">${esc(u.displayName || 'Unnamed user')}</span>
                    <span class="text-xs text-slate-500 ml-2">${esc(u.email || 'no email')}</span>
                  </div>
                  <div class="flex items-center gap-1.5 flex-shrink-0">
                    ${u.role ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold ${
                      u.role === 'owner' ? 'bg-green-50 text-green-700' : 'bg-slate-100 text-slate-600'
                    }">${esc(u.role)}</span>` : ''}
                    <span class="text-[11px] text-slate-400">user #${u.iUserId}</span>
                    ${u.iIdUserId != null
                      ? `<span class="text-[11px] text-slate-400">· id #${u.iIdUserId}</span>`
                      : '<span class="text-[11px] text-amber-600">· not signed in via id yet</span>'}
                  </div>
                </div>
              </div>`).join('')
          : '<div class="px-5 py-3 border-t border-slate-100 text-xs text-slate-400">No members.</div>';

        return `
          <section class="bg-white rounded-2xl border ${orphan ? 'border-amber-200' : 'border-slate-200'} shadow-sm overflow-hidden">
            <div class="px-5 py-3 flex items-center justify-between gap-3">${header}</div>
            ${users}
          </section>`;
      }).join('');
    }

    // Sign-in methods live in the id app now; deep-link its admin console.
    (function initIdAdminLink() {
      const base = window.ECHO_CONFIG?.ID_BASE_URL;
      const a = document.getElementById('idAdminLink');
      if (base && a) {
        a.href = base.replace(/\/+$/, '') + '/admin';
        a.classList.remove('hidden');
      }
    })();

    load();
  </script>
</body>
</html>
