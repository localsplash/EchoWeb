<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen flex items-center justify-center p-4 font-sans">
  <form method="post" action="/login" class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
    <div class="flex justify-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
      </div>
    </div>
    <h1 class="text-2xl font-bold text-slate-800 text-center">Echo Messages</h1>
    <p class="text-sm text-slate-500 text-center mt-1 mb-8">Enter your business number to continue</p>
    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Business Number</label>
    <input
      name="businessNumber"
      inputmode="numeric"
      pattern="\d{10}"
      maxlength="10"
      minlength="10"
      required
      placeholder="7145551234"
      class="w-full px-4 py-3 text-lg tracking-widest rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
    />
    <button type="submit" class="w-full mt-4 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl transition-colors">
      Continue
    </button>
  </form>
</body>
</html>
