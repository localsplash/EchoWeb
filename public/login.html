<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo · Sign In</title>
  <link rel="icon" href="/img/echo-favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center">
        <!-- Inlined rather than <img> so the mark inherits text-white via currentColor -->
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor" role="img" aria-label="Echo Messaging">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M3 4C3 2.89543 3.89543 2 5 2H13C14.1046 2 15 2.89543 15 4V11C15 12.1046 14.1046 13 13 13H9.41421L5 17.4142V13H5C3.89543 13 3 12.1046 3 11V4ZM5 3H13C13.5523 3 14 3.44772 14 4V11C14 11.5523 13.5523 12 13 12H8.58579L6 14.5858V12H5C4.44772 12 4 11.5523 4 11V4C4 3.44772 4.44772 3 5 3Z"/>
          <path d="M6 5H12V6.25H6V5Z"/>
          <path d="M6 7.25H11V8.5H6V7.25Z"/>
          <path d="M6 9.5H10V10.75H6V9.5Z"/>
          <path d="M16.0 5.8C17.4 6.3 18.5 7.5 19.0 9.0L18.0 9.3C17.6 8.1 16.8 7.2 15.7 6.8Z"/>
          <path d="M16.6 3.8C18.6 4.5 20.2 6.2 21.0 8.8L19.9 9.2C19.2 7.0 18.0 5.6 16.3 5.0Z"/>
          <path d="M17.2 1.8C19.8 2.8 21.8 5.0 22.7 8.6L21.5 9.1C20.7 6.0 19.0 4.2 16.8 3.3Z"/>
        </svg>
      </div>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 text-center">Echo</h1>
    <p class="text-sm text-slate-500 text-center mt-1 mb-8">Your messaging workspace</p>

    <!-- Error banner -->
    <div id="errorBanner" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-700"></div>

    <!-- One way in: the identity service holds every provider.
         Google, Microsoft and the ISP bridge are all registered there once for
         the whole platform, so this app offers a door rather than a menu. -->
    <a href="/auth/identity"
       class="flex items-center justify-center gap-3 w-full py-3 px-4 rounded-xl
              bg-blue-600 hover:bg-blue-700 transition-all
              text-white font-semibold text-sm">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25"/>
      </svg>
      Sign in
    </a>

    <p class="mt-6 text-xs text-slate-400 text-center">
      Google, Microsoft and your Wisp.net ISP account all work — you'll choose
      on the next screen.
    </p>

  </div>

  <script src="/config.js"></script>
  <script>
    // Show error banners from query params
    const params = new URLSearchParams(location.search);
    const errorMap = {
      google_denied:            'Google sign-in was cancelled.',
      microsoft_denied:         'Microsoft sign-in was cancelled.',
      microsoft_not_configured: 'Microsoft sign-in is not yet configured. Please contact support.',
      missing_code:             'The sign-in provider did not return an auth code.',
      invalid_state:            'Login session expired. Please try again.',
      csrf_mismatch:            'Security check failed. Please try again.',
      link_expired:             'Your session expired before the account could be linked. Please try again.',
      token_exchange_failed:    'Could not complete sign-in. Please try again.',
      userinfo_failed:          'Could not read your account info from the sign-in provider.',
      no_account:               'No Echo account found for that address. Please sign in via your Wisp.net UISP account first.',
      no_membership:            'Your account isn\'t connected to any organisation yet.',
      uisp_fetch_failed:        'Could not reach your Wisp.net UISP account. Please try again.',
      sso_replay:               'This sign-in link has already been used. Please try again.',
      sso_not_configured:       'UISP sign-in is not yet configured. Please contact support.',
      invalid_sso_code:         'The UISP sign-in link is invalid or expired. Please try again.',
      missing_sso_params:       'Incomplete sign-in link from your Wisp.net UISP portal.',
    };
    const err = params.get('auth_error');
    if (err && errorMap[err]) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = errorMap[err];
      banner.classList.remove('hidden');
    }
  </script>
</body>
</html>
