<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo · Internal Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">

    <!-- Badge -->
    <div class="flex items-center justify-center mb-6 gap-2">
      <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598
               6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332
               9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196
               0-6.1-1.248-8.25-3.285z"/>
        </svg>
      </div>
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Internal</span>
    </div>

    <h1 class="text-xl font-bold text-slate-800 text-center">Select Business</h1>
    <p class="text-sm text-slate-500 text-center mt-1 mb-6">
      Enter the business phone number to access that organisation's messages.
    </p>

    <form method="post" action="/internal/select-org">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
        Business Number
      </label>
      <input
        name="businessNumber"
        inputmode="numeric"
        pattern="\(\d{3}\) \d{3}-\d{4}"
        maxlength="14"
        minlength="14"
        required
        autofocus
        placeholder="(714) 555-1234"
        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-500
               focus:ring-2 focus:ring-slate-200 outline-none transition-all text-center
               font-bold placeholder:text-slate-300"
        style="font-size:2rem; letter-spacing:0; line-height:1.1;"
        oninput="fmt(this)"
      />
      <button type="submit"
        class="w-full mt-4 py-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-900
               text-white font-semibold rounded-xl transition-colors">
        Access
      </button>
    </form>

    <hr class="my-6 border-slate-100" />

    <a href="/internal/accounts"
       class="flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl
              border border-slate-200 hover:border-slate-300 hover:bg-slate-50
              transition-all text-slate-700 font-medium text-sm mb-4">
      <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125
             4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15
             19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375
             6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0
             016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
      </svg>
      View account associations
    </a>

    <form method="post" action="/logout">
      <button type="submit" class="w-full text-xs text-slate-400 hover:text-red-500 transition-colors">
        Sign out
      </button>
    </form>

  </div>

  <script>
    function fmt(el) {
      const d = String(el.value || '').replace(/\D/g, '').slice(0, 10);
      if (d.length <= 3) el.value = d;
      else if (d.length <= 6) el.value = `(${d.slice(0,3)}) ${d.slice(3)}`;
      else el.value = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
    }
    document.querySelector('form').addEventListener('submit', function() {
      const inp = document.querySelector('input[name="businessNumber"]');
      inp.value = String(inp.value || '').replace(/\D/g,'').slice(0,10);
    });
  </script>
</body>
</html>
