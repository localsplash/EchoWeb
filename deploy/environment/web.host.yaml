# Host wiring for echo-web: a loopback port for deploy.sh's health check, and
# start order. Service definitions stay in EchoWeb/compose.yaml.
services:
  echo-web:
    ports:
      - 127.0.0.1:18160:3160
    depends_on:
      echo-db-users:
        condition: service_completed_successfully
      echo-service:
        condition: service_started
      echo-media:
        condition: service_started
