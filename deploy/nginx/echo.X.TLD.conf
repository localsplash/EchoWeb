# EchoWeb — the browser application.
#
# TEMPLATE. `X.TLD` is the whitelabel parent domain this deployment serves
# under; substitute it throughout before use. The certificate id is whatever
# NPM assigned for that hostname. Adopted from EchoOrchestrator at e07b811.
#
# Historical/fallback reference only. Nginx Proxy Manager owns the live edge.

server {
    listen 80;
    listen [::]:80;
    server_name echo.X.TLD;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name echo.X.TLD;

    ssl_certificate     /opt/nginx-proxy-manager/letsencrypt/live/npm-REPLACE/fullchain.pem;
    ssl_certificate_key /opt/nginx-proxy-manager/letsencrypt/live/npm-REPLACE/privkey.pem;

    client_max_body_size 40m;

    location / {
        proxy_pass http://echo-web:3160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
