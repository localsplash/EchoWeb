# Standalone dev — for full stack use EchoOrchestrator instead.
services:
  echo-web:
    build: .
    container_name: echo-web
    environment:
      PORT: "3160"
      ECHO_SERVICE_BASE_URL: ${ECHO_SERVICE_BASE_URL:-http://host.docker.internal:18080}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:18082}
    ports:
      - "127.0.0.1:3160:3160"
    restart: unless-stopped
