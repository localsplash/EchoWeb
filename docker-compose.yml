# Standalone dev — for full stack use EchoOrchestrator instead.
#
# EchoWeb reads its settings from echo_tbl_Settings in the Echo database.
# What is stated here is only what cannot describe itself: how to reach that
# database. Nothing is read from NocoDB, so no token is needed to run this.
services:
  echo-web:
    build: .
    container_name: echo-web
    environment:
      PORT: "3160"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      DB_USER: ${DB_USER:-echo_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-echo_db}
    ports:
      - "127.0.0.1:3160:3160"
    restart: unless-stopped
