# Standalone dev — for full stack use EchoOrchestrator instead.
# PlatformConfig credentials and the application database pool come from the
# deployment environment. No Identity configuration volume is used.
services:
  echo-web:
    build: .
    container_name: echo-web
    environment:
      PORT: "3160"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      DB_USER: ${DB_USER:-echo_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-echo_db}
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:?Set the PlatformConfig NocoDB URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:?Set this service NocoDB token}
    ports:
      - "127.0.0.1:3160:3160"
    restart: unless-stopped
