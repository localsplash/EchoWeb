# Standalone dev — for full stack use EchoOrchestrator instead.
#
# EchoWeb reads its settings from echo_tbl_Settings in the Echo database, and
# PARENT_DOMAIN / IDENTITY_CLIENT_SECRET from the IdentityBase NocoDB base.
# What is stated here is only what cannot describe itself: how to reach those
# two. Values come from a sibling .env, which Compose substitutes below.
services:
  echo-web:
    build: .
    container_name: echo-web
    environment:
      PORT: "3160"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-13306}
      DB_USER: ${DB_USER:-echo_app}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-echo_db}
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:-}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
    ports:
      - "127.0.0.1:3160:3160"
    restart: unless-stopped
